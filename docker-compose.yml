services:
  rag-app:
    build: .
    container_name: cognirag-app
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
    env_file:
      - .env
    volumes:
      - ./data:/app/data                      # persist SQLite database, uploaded files, and memory
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  neo4j:
    image: neo4j:5-community
    container_name: cognirag-neo4j
    ports:
      - "7474:7474"                           # Neo4j Browser Web UI
      - "7687:7687"                           # Bolt Protocol Driver
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password123}
      # Strict memory limits for 16GB RAM host (capped at 1.5GB total footprint)
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1024m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - ./data/neo4j/data:/data                # Persist graph database data
      - ./data/neo4j/logs:/logs                # Persist database logs
    deploy:
      resources:
        limits:
          memory: 1500M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
